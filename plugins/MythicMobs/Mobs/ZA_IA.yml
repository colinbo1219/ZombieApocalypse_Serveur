# ZombieApocalypse - zombies intelligents (agent E) : Charognard, Phototrope, gardiens du bunker Z-01
ZA_Charognard:
  Type: ZOMBIE
  Display: '&6Charognard'
  Health: 42
  Damage: 5
  Armor: 2
  Options:
    MovementSpeed: 0.21
    FollowRange: 48
    PreventSunburn: true
    PreventOtherDrops: true
    PreventConversion: true
    Silent: true
    KnockbackResistance: 0.2
  Skills:
  - effect:sound{s=entity.zombie.ambient;v=1;p=0.5} @self ~onTimer:180 0.6
  - effect:sound{s=entity.zombie.hurt;v=1;p=0.55} @self ~onDamaged
  - effect:sound{s=entity.zombie.death;v=1;p=0.45} @self ~onDeath
  - skill{s=ZA_Charognard_Bave} @self ~onTimer:100
  - command{c="zakill ZA_Charognard";sync=true} @self ~onDeath
  Drops:
  - rotten_flesh 2to3 0.9
  - bone 1to2 0.7
  - ZA_Essence 1 0.3
  - ZA_Jeton 1to2 0.3
  - exp 12 1
ZA_Phototrope:
  Type: ZOMBIE
  Display: '&e&lPhototrope'
  Health: 16
  Damage: 3.5
  Options:
    MovementSpeed: 0.3
    FollowRange: 48
    PreventSunburn: true
    PreventOtherDrops: true
    PreventConversion: true
    Silent: true
  Skills:
  - potion{type=GLOWING;duration=99999;level=0} @self ~onSpawn
  - skill{s=ZA_Phototrope_Lueur} @self ~onTimer:12
  - effect:sound{s=entity.zombie.ambient;v=1;p=1.3} @self ~onTimer:150 0.5
  - effect:sound{s=entity.zombie.hurt;v=1;p=1.3} @self ~onDamaged
  - effect:sound{s=entity.zombie.death;v=1;p=1.2} @self ~onDeath
  - command{c="zakill ZA_Phototrope";sync=true} @self ~onDeath
  Drops:
  - rotten_flesh 1 0.5
  - ZA_Essence 1 0.2
  - glowstone_dust 1to2 0.5
  - exp 6 1
