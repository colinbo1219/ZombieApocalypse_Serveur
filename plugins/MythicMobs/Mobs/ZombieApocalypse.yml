ZA_Shambler:
  Type: ZOMBIE
  Display: '&2Shambler'
  Health: 20
  Damage: 3
  Options:
    MovementSpeed: 0.19
    FollowRange: 36
    PreventSunburn: true
    PreventOtherDrops: true
    PreventConversion: true
    Silent: true
  Skills:
  - skill{s=ZA_Agrippe} @target ~onAttack 0.2
