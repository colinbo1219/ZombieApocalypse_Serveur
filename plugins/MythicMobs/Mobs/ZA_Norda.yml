# ZombieApocalypse - NORDA dans le monde (bible IA-11, points 79, 100, 101) et zombies de saison (13, 23, 27)
# Les agents portent le tag za_norda : au palier 5, le plugin ZAMoteur capture au lieu de laisser mourir (100).
# Les patrouilles sont posées par za_p103_moteur (za_mot_norda_patrouille), hors de vue.
ZA_Agent_NORDA:
  Type: PILLAGER
  Display: '&fAgent NORDA'
  Health: 36
  Damage: 5
  Armor: 6
  Faction: ZA_Norda
  Options:
    MovementSpeed: 0.28
    FollowRange: 36
    Despawn: true
    PreventOtherDrops: true
    PreventItemPickup: true
    KnockbackResistance: 0.2
  AITargetSelectors:
  - 0 clear
  - 1 attacker
  - 2 players
  - 3 otherfactionmonsters
  Equipment:
  - CROSSBOW:0
  - LEATHER_CHESTPLATE:2
  - IRON_HELMET:4
  Skills:
  - addscoreboardtag{tag=za_norda} @self ~onSpawn
  - effect:sound{s=block.beacon.ambient;v=0.4;p=1.8} @self ~onTimer:200 0.4
  - message{m="&4« Contrôle sanitaire. Ne bougez plus. »"} @PlayersInRadius{r=16} ~onTarget
  Drops:
  - iron_nugget 1to3 0.6
  - paper 1 0.3
ZA_Chasseur_NORDA:
  Type: VINDICATOR
  Display: '&fÉquipe de récupération NORDA'
  Health: 50
  Damage: 6
  Armor: 8
  Faction: ZA_Norda
  Options:
    MovementSpeed: 0.3
    FollowRange: 40
    Despawn: true
    PreventOtherDrops: true
    PreventItemPickup: true
    KnockbackResistance: 0.3
  AITargetSelectors:
  - 0 clear
  - 1 attacker
  - 2 players
  Equipment:
  - IRON_AXE:0
  - IRON_CHESTPLATE:2
  - IRON_HELMET:4
  Skills:
  - addscoreboardtag{tag=za_norda} @self ~onSpawn
  - potion{type=SLOW;duration=40;level=1} @target ~onAttack 0.4
  Drops:
  - iron_ingot 1 0.4

