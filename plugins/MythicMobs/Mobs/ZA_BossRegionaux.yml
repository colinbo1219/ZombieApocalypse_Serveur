# ZombieApocalypse - BOSS RÉGIONAUX (za_p83_boss_regionaux.sk) : un par région, une fois par saison ; l'Overlord reste
# au-dessus d'eux. Apparence : za_modeles 1.7.0 (règles de nom « Le Boucher », « La Matriarche », « Le Gardien », « Le Brûlé »).
# Récompense unique : Items/ZA_Legendaires.yml. La mort prévient Skript (zaregboss mort <id>).
ZA_Boucher:
  Type: ZOMBIE
  Display: '&4&lLe Boucher'
  Health: 420
  Damage: 14
  Armor: 8
  Options:
    MovementSpeed: 0.21
    FollowRange: 40
    PreventSunburn: true
    PreventOtherDrops: true
    PreventConversion: true
    Silent: true
    KnockbackResistance: 1.0
    Despawn: false
  Skills:
  - addscoreboardtag{tag=za_rb_boucher} @self ~onSpawn
  - skill{s=ZA_Boucher_Crochet} @Target ~onTimer:100
  - skill{s=ZA_Boucher_Couperet} @Target ~onTimer:140
  - skill{s=ZA_Boucher_Carcasses} @self ~onDamaged <50%
  - potion{type=WITHER;duration=60;level=0} @target ~onAttack 0.5
  - effect:sound{s=za_modeles:zombie.brute.souffle;v=1.5;p=0.5} @self ~onTimer:120 0.6
  - effect:sound{s=entity.ravager.hurt;v=1.2;p=0.6} @self ~onDamaged
  - effect:particles{p=reddust;color=#6a0000;a=6;hS=0.35;vS=0.9;s=0} @self ~onTimer:10
  - command{c="zaregboss mort boucher";sync=true} @self ~onDeath
  Drops:
  - ZA_Couperet_Boucher 1 1
  - ZA_Jeton 10to16 1
  - ZA_Essence 3to5 1
  - exp 120 1
