  - effect:sound{s=entity.warden.nearby_close;v=1.2;p=1.4} @self ~onTimer:100 0.5
  - effect:sound{s=entity.ghast.hurt;v=1;p=0.7} @self ~onDamaged 0.5
  - effect:particles{p=spore_blossom_air;a=8;hS=1.2;vS=1.2;s=0} @self ~onTimer:10
  - effect:particles{p=sculk_soul;a=1;hS=0.5;vS=0.8;s=0.01} @self ~onTimer:30
