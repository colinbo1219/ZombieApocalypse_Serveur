# ZombieApocalypse - skills (VERSION SANS ModelEngine)
ZA_Spit:
  Cooldown: 4
  Conditions:
  - playerwithin{d=18} true
  Skills:
  # animation (modeles EMF des joueurs): "swingarm" declenche le mouvement special
  - swingarm @self
  - effect:sound{s=entity.llama.spit;v=1;p=0.6} @self
  - projectile{onTick=ZA_AcidTick;onHit=ZA_AcidHit;v=9;i=1;hR=0.6;vR=0.6;mr=20}
ZA_AcidTick:
  Skills:
  - effect:particles{p=happyVillager;a=3;hS=0.1;vS=0.1;s=0} @origin
ZA_AcidHit:
  Skills:
  - damage{a=4}
  - potion{type=POISON;duration=100;level=1}
  - command{c="zainfect <target.name> 30";sync=true}
  - effect:sound{s=block.lava.extinguish;v=1;p=1.2} @target
  - effect:particles{p=happyVillager;a=15;hS=0.4;vS=0.4;s=0.05} @target
ZA_BloaterBurst:
  Skills:
  - explosion{yield=2;blockdamage=false;fire=false} @self
  - damage{a=6} @PIR{r=4}
  - command{c="zainfect <target.name> 45";sync=true} @PIR{r=6}
  - potion{type=POISON;duration=160;level=1} @PIR{r=6}
  - potion{type=CONFUSION;duration=140;level=0} @PIR{r=6}
  - effect:particles{p=happyVillager;a=60;hS=2.5;vS=1.5;s=0.02} @self
  - effect:sound{s=entity.slime.squish;v=1.5;p=0.5} @self
ZA_Lunge:
  Cooldown: 5
  Conditions:
  - playerwithin{d=10} true
  Skills:
  # animation (modeles EMF des joueurs): "swingarm" declenche le mouvement special
  - swingarm @self
  - effect:sound{s=entity.ravager.roar;v=1;p=1.6} @self
  - lunge{velocity=1.5;velocityY=0.5} @Self
ZA_Scream:
  Cooldown: 25
  Conditions:
  - playerwithin{d=24} true
  Skills:
  # animation (modeles EMF des joueurs): "swingarm" declenche le mouvement special
  - swingarm @self
  - delay 6
  - swingarm @self
  - delay 6
  - swingarm @self
  - effect:sound{s=entity.ghast.scream;v=2;p=0.6} @self
  - command{c="zamsg <target.l.w> <target.l.x> <target.l.y> <target.l.z> 30 &cUn hurlement déchire la nuit... les morts accourent !";sync=true} @self
  - summon{type=ZA_Shambler;amount=3;radius=6} @self
  - potion{type=SLOW;duration=60;level=0} @PIR{r=12}
  - effect:particles{p=cloud;a=30;hS=1;vS=1;s=0.05} @self
ZA_Overlord_Spawn:
  Skills:
  - effect:sound{s=entity.wither.spawn;v=3;p=0.7} @self
  - command{c="zamsg <target.l.w> <target.l.x> <target.l.y> <target.l.z> 90 &4&lL'Undead Overlord s'est éveillé !";sync=true} @self
  - potion{type=DAMAGE_RESISTANCE;duration=100;level=3} @self
