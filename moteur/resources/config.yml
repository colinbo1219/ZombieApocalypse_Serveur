# ZAMoteur — réglages (bible F1, F5). Les changements se font aussi en jeu : /zaadmin systeme <nom> on|off
systemes:
  hordes: true          # simulation des hordes virtuelles, contamination, nids
  directeur: true       # le metteur en scène (intensité, calme / montée / pic / relâche)
  cerveaux: true        # sens et machine à états des zombies proches des joueurs
  nemesis: true         # le zombie qui tue devient un vétéran nommé
  norda: true           # dossiers, drones, barrages, capture
  lea: true             # Léa choisit les nouvelles à partir de la Chronique
  ecosysteme: true      # oiseaux, silence, corbeaux, échos lointains
  telemetrie: true      # rapport quotidien (plugins/ZAMoteur/rapports)
  materialisation: true # les hordes virtuelles deviennent de vrais zombies près des joueurs
  factions: true        # factions PNJ qui jouent, convois, blocus, traités, prix régionaux (IA-10, S-3)
  bases: true           # bases vivantes : le cerveau des bases et des survivants décide (IA-15, IA-8)
  omega: false          # narrateur par IA (facultatif, demande une clé)

budget:
  apparitions_par_tick: 6
  blocs_par_tick: 200

plafonds:
  zombies_reels_serveur: 350
  zombies_reels_joueur: 40

# Ω (bible IA-16) : facultatif et PAYANT (API à l'usage, séparée de tout abonnement). Laisser la clé vide pour ne rien
# envoyer à l'extérieur. Fournisseur : anthropic (modèle Haiku, ~10 $/mois à 5 joueurs) ou gemini (version gratuite :
# Google utilise les échanges, serveur privé seulement). Seuls les pseudos et les événements du jeu sont envoyés.
omega:
  fournisseur: anthropic
  cle: ""
  modele: claude-haiku-4-5
  quota_jour: 40
  quota_joueur: 8
  url: https://api.anthropic.com/v1/messages
