name: ZAMoteur
version: 1.0.0
main: za.moteur.ZAMoteur
api-version: '1.20'
author: Colin
description: Moteur du monde ZombieApocalypse (Chronique, hordes, Directeur, NORDA, Léa)
softdepend: [MythicMobs, Skript, ZAMonde]
commands:
  zam:
    description: Interne (Skript -> moteur)
    permission: za.admin
  zaadmin:
    description: Outils du moteur ZA
    permission: za.admin
  infos:
    description: Ce que tu sais (nouvelles, rumeurs, avec leur âge et leur fiabilité)
    aliases: [rumeurs]
  signaler:
    description: Faire passer le mot sur ce que tu as vu
permissions:
  za.admin:
    default: op
